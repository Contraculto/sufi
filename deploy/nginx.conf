# ─────────────────────────────────────────────────────────────────────────────
# SUFI Nginx config — coexistence with existing PHP site
#
# Scenario: SUFI files in /var/www/html/sufi/
#           Existing site in /var/www/html/
#           PHP-FPM socket at /run/php/php8.4-fpm.sock
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 443 ssl http2;
    server_name example.com;

    root /var/www/html;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    # ── SUFI: block sys/ ─────────────────────────────────────────────────────
    location ~ ^/sufi/sys/ {
        deny all;
        return 403;
    }

    # ── SUFI: ActivityPub discovery & API ────────────────────────────────────
    location ~ ^/(\.well-known/(webfinger|host-meta|nodeinfo)|ap(/|$)|tags(/|$)|@[^/]+/?$) {
        fastcgi_pass   unix:/run/php/php8.4-fpm.sock;
        fastcgi_param  SCRIPT_FILENAME /var/www/html/sufi/index.php;
        fastcgi_param  REQUEST_URI     $request_uri;
        include        fastcgi_params;
    }

    # ── Existing site ─────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass   unix:/run/php/php8.4-fpm.sock;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include        fastcgi_params;
    }
}

server {
    listen 80;
    server_name example.com;
    return 301 https://$host$request_uri;
}
