# ─────────────────────────────────────────────────────────────────────────────
# SUFI Apache VirtualHost — coexistence with existing PHP site
#
# Scenario: SUFI files in /var/www/html/sufi/
#           Existing site in /var/www/html/
#
# The key idea: specific paths are aliased to SUFI's index.php.
# The existing site handles everything else.
# ─────────────────────────────────────────────────────────────────────────────

<VirtualHost *:443>
    ServerName example.com
    DocumentRoot /var/www/html

    # ── SUFI: block sys/ ─────────────────────────────────────────────────────
    <Directory /var/www/html/sufi/sys>
        Require all denied
    </Directory>

    # ── SUFI: route ActivityPub paths ────────────────────────────────────────
    RewriteEngine On

    RewriteRule ^/\.well-known/(webfinger|host-meta)$  /var/www/html/sufi/index.php [L]
    RewriteRule ^/ap(/.*)?$                            /var/www/html/sufi/index.php [L]
    RewriteRule ^/@([^/]+)/?$                          /var/www/html/sufi/index.php [L]

    # ── Existing site routing (example — adjust to your framework) ───────────
    <Directory /var/www/html>
        AllowOverride All
        Require all granted
    </Directory>

    # SSL
    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/example.com/privkey.pem
</VirtualHost>
