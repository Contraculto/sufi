# ─────────────────────────────────────────────────────────────────────────────
# SUFI Nginx config — real-world example
#
# This is the actual config used in production for contraculto.com.
# SUFI sits alongside an existing static/PHP site. Only the discovery and
# ActivityPub paths are routed to SUFI's index.php.
#
# Adapt the server_name, root, and socket paths to your setup.
# ─────────────────────────────────────────────────────────────────────────────

server {
    server_name    example.com;

    listen         80;
    listen         [::]:80;

    location / {
      return         301 https://$server_name$request_uri;
    }
}

ssl_session_cache shared:ssl_session_cache:10m;

server {
    server_name example.com;

    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MozSSL:10m;
    ssl_session_tickets off;

    ssl_trusted_certificate   /etc/letsencrypt/live/example.com/chain.pem;
    ssl_certificate           /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key       /etc/letsencrypt/live/example.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers "ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-SHA384:ECDHE-RSA-AES256-SHA384:!aNULL:!eNULL:!EXPORT:!DES:!MD5:!PSK:!RC4";
    ssl_prefer_server_ciphers off;
    ssl_ecdh_curve X25519:prime256v1:secp384r1:secp521r1;

    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css application/json application/javascript text/xml
               application/xml application/xml+rss text/javascript
               application/activity+json application/atom+xml;

    client_max_body_size 16m;
    ignore_invalid_headers off;

    # ── SUFI: block direct access to sys/ ────────────────────────────────────
    location ^~ /sufi/sys/ {
        deny all;
        return 403;
    }

    # ── SUFI: ActivityPub & discovery endpoints ───────────────────────────────
    location = /.well-known/webfinger {
        include fastcgi_params;
        fastcgi_pass  unix:/run/php/php8.4-fpm-example.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/example/sufi/index.php;
    }

    location = /.well-known/host-meta {
        include fastcgi_params;
        fastcgi_pass  unix:/run/php/php8.4-fpm-example.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/example/sufi/index.php;
    }

    location ~ ^/ap(/|$) {
        include fastcgi_params;
        fastcgi_pass  unix:/run/php/php8.4-fpm-example.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/example/sufi/index.php;
    }

    location ~ ^/@[^/]+(/|$) {
        include fastcgi_params;
        fastcgi_pass  unix:/run/php/php8.4-fpm-example.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/example/sufi/index.php;
    }

    # ── Existing site ─────────────────────────────────────────────────────────
    location / {
        root /var/www/example/;
        index index.html index.htm index.php;

        location ~ \.php$ {
            include snippets/fastcgi-php.conf;
            fastcgi_pass unix:/run/php/php8.4-fpm-example.sock;
        }
    }
}

server {
    server_name www.example.com;

    listen 80;
    listen [::]:80;
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    return 301 https://example.com$request_uri;
}
